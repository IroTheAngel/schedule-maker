<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)"><title>Schedule Maker</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png">
<style>
:root{color-scheme:light dark;--bg:#F4F3EE;--card:#FFFFFF;--line:#E4E1D8;--text:#1F1E1D;--mute:#6F6D66;--acc:#C15F3C;--soft:#EBE9E1;--tint:#F7EBE5;--bad:#B84A3A;--green:#5E8466;--r1:8px;--r2:12px;--r3:16px;--r4:24px;--shadow:0 1px 2px rgba(31,30,29,.05),0 6px 20px rgba(31,30,29,.06);
--c-piano:#C15F3C;--c-chess:#5E8466;--c-gym:#4F7CA8;--c-study:#7E64A8;--c-act:#A9822A;--c-art:#B35E7D;--c-life:#8A867C}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark;--bg:#161615;--card:#20201E;--line:#33332F;--text:#F0EFEA;--mute:#9C9A94;--acc:#D97757;--soft:#2C2C2A;--tint:#33251F;--bad:#E07A6A;--green:#8DB596;--shadow:0 6px 20px rgba(0,0,0,.35);--c-piano:#D97757;--c-chess:#8DB596;--c-gym:#7FA7CF;--c-study:#A991D4;--c-act:#D4B25E;--c-art:#D88AA6;--c-life:#A6A39A}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161615;--card:#20201E;--line:#33332F;--text:#F0EFEA;--mute:#9C9A94;--acc:#D97757;--soft:#2C2C2A;--tint:#33251F;--bad:#E07A6A;--green:#8DB596;--shadow:0 6px 20px rgba(0,0,0,.35);--c-piano:#D97757;--c-chess:#8DB596;--c-gym:#7FA7CF;--c-study:#A991D4;--c-act:#D4B25E;--c-art:#D88AA6;--c-life:#A6A39A}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:110px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
svg{width:20px;height:20px;flex-shrink:0}
.wrap{max-width:560px;margin:auto;padding:0 18px}
.serif{font-family:ui-serif,Georgia,Cambria,"Times New Roman",serif;font-weight:400}
header{padding:calc(32px + var(--safe-area-inset-top,env(safe-area-inset-top,0px))) 0 16px;position:relative}
.gear{position:absolute;top:calc(26px + var(--safe-area-inset-top,env(safe-area-inset-top,0px)));inset-inline-end:0;width:40px;height:40px;border-radius:var(--r2);display:grid;place-items:center;color:var(--mute)}
.gear:hover{background:var(--soft)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:var(--r2);padding:4px;gap:2px;margin-top:6px}
.seg button{padding:9px 4px;border-radius:9px;font-size:14px;font-weight:500;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg svg{width:16px;height:16px}
.stitle{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:16px}
.date{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{font-size:34px;letter-spacing:-.6px;margin-top:6px;line-height:1.15}
.sum{color:var(--mute);margin-top:6px;font-size:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{padding:9px;border-radius:11px;font-size:15px;font-weight:500;color:var(--mute);transition:all .2s}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.label{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 2px 10px}
/* now card */
.now{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px;display:none}
.now.show{display:block;animation:fade .35s ease}
.nowtop{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:600}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 1.6s infinite}
.nowmain{display:flex;align-items:center;gap:14px;margin-top:14px}
.big-ic{width:48px;height:48px;border-radius:var(--r3);background:color-mix(in srgb,var(--c,var(--acc)) 16%,transparent);color:var(--c,var(--acc));display:grid;place-items:center;flex-shrink:0}
.big-ic svg{width:24px;height:24px}
.nowname{font-size:24px;line-height:1.2}
.nowsub{color:var(--mute);font-size:14px;margin-top:2px}
.cd{font-size:44px;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin-top:14px}
.cd small{font-size:14px;color:var(--mute);letter-spacing:0;margin-inline-start:8px;font-family:ui-sans-serif,system-ui,sans-serif}
.track{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:12px}
.track div{height:100%;width:0;background:var(--acc);border-radius:6px;transition:width 1s linear}
.nowbtns{display:flex;gap:8px;margin-top:16px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;font-size:15px;font-weight:500;transition:transform .12s,background .15s;text-decoration:none;color:inherit}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}.btn.acc:hover{filter:brightness(1.06)}
.btn.grow{flex:1}.btn svg{width:18px;height:18px}
.btn.full{width:100%}
/* composer */
.composer{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 12px 12px 16px;box-shadow:var(--shadow);margin-bottom:24px}
.inrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#nm{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:4px 0}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--mute);user-select:none;transition:all .15s;background:transparent;text-decoration:none}
.chip svg{width:15px;height:15px}
.chip.on{border-color:var(--acc);color:var(--acc);background:var(--tint)}
.chip input{border:0;outline:0;background:transparent;width:30px;font-size:13px;text-align:end;-moz-appearance:textfield}
.send{flex-shrink:0;width:38px;height:38px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;transition:transform .12s}
.send:active{transform:scale(.92)}.send svg{width:18px;height:18px}
.smart{display:none;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:14px;background:var(--tint);border:1px solid var(--acc)}
.smart.show{display:flex;animation:pop .3s ease}
.smart .t{flex:1;font-size:14px;line-height:1.35}.smart b{color:var(--acc);font-weight:600}
.smart>svg{color:var(--acc);width:22px;height:22px}
/* timeline */
.row{display:grid;grid-template-columns:48px 1fr;gap:10px;max-height:160px;transition:all .38s ease}
.tm{text-align:end;padding-top:15px;font-size:13px;font-variant-numeric:tabular-nums}
.tm span{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px 12px 12px;margin:5px 0;min-width:0;transition:all .2s}
.task.late{border-style:dashed;border-color:var(--bad)}
.task.opt{border-style:dashed}
.task.past{opacity:.55}
.ic{width:38px;height:38px;border-radius:var(--r2);background:color-mix(in srgb,var(--c,var(--c-life)) 16%,transparent);color:var(--c,var(--c-life));display:grid;place-items:center;flex-shrink:0}
.task{box-shadow:inset 3px 0 0 var(--c,transparent);}
[dir=rtl] .task{box-shadow:inset -3px 0 0 var(--c,transparent)}
[dir=rtl] .flip svg{transform:scaleX(-1)}
.task{touch-action:pan-y;user-select:none}
.task.cur{background:color-mix(in srgb,var(--c,var(--acc)) 10%,var(--card));border-color:var(--c,var(--acc))}
.task.cur .ic{background:var(--c,var(--acc));color:#fff}
.mid{flex:1;min-width:0}
.name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--mute);margin-top:2px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.meta svg{width:13px;height:13px}
.task.late .meta{color:var(--bad)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--mute)}
.tag.fix{border-color:var(--acc);color:var(--acc)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:all .2s;flex-shrink:0}
.ck svg{width:16px;height:16px}.ck:hover{border-color:var(--acc);color:var(--acc)}
.x{width:30px;height:30px;border-radius:8px;color:var(--mute);display:grid;place-items:center;flex-shrink:0}
.x:hover{background:var(--soft)}.x svg{width:16px;height:16px}
.row.leaving{opacity:0;transform:translateX(30px);max-height:0}
.row.leaving .ck{background:var(--acc);border-color:var(--acc);color:#fff;transform:scale(1.15)}
.gap{display:grid;grid-template-columns:48px 1fr;gap:10px;color:var(--mute);font-size:12px}
.gap div{display:flex;align-items:center;gap:6px;padding:3px 12px}
.gap.free{color:var(--green)}
.gap svg{width:14px;height:14px}
.empty{text-align:center;color:var(--mute);padding:30px 0;font-size:19px;line-height:1.5}
.skipped{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
/* week */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.days button{padding:10px 0;border-radius:12px;font-size:13px;font-weight:500;color:var(--mute);border:1px solid transparent;position:relative}
.days button.on{background:var(--acc);color:#fff}
.days button.td:not(.on){border-color:var(--line);color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:24px;margin-bottom:4px}
.card .sub{color:var(--mute);font-size:14px;line-height:1.45}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);min-width:0}
.fld input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:15px;text-transform:none;letter-spacing:0;outline:0}
.fld input:focus{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ri{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ri:first-child{border-top:0}
.ri .mid{cursor:pointer}
.ri .ic{width:34px;height:34px;border-radius:var(--r2)}
.ord{display:flex;flex-direction:column}
.ord button{width:28px;height:20px;color:var(--mute);display:grid;place-items:center}
.ord svg{width:15px;height:15px}
.list{margin:14px 0 12px}
.pp{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pp div{display:flex;gap:10px;background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14px}
.pp b{width:34px;flex-shrink:0;font-weight:600}
.pp span{color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tg{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text);padding:6px 0;text-transform:none;letter-spacing:0}
.tg input{width:20px;height:20px;accent-color:var(--acc)}
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dpick label{display:block}
.dpick input{display:none}
.dpick span{display:block;text-align:center;padding:9px 0;border-radius:var(--r2);border:1px solid var(--line);font-size:13px;color:var(--mute);text-transform:none;letter-spacing:0}
.dpick input:checked+span{background:var(--c-study);border-color:var(--c-study);color:#fff}
.form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));z-index:5}
.dock .in{max-width:560px;margin:auto;display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px}
.dock .btn{padding:10px 12px}
.dock input{width:46px;border:1px solid var(--line);border-radius:10px;padding:10px 6px;background:var(--card);text-align:center;font-size:14px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,20,19,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
.ov.show{display:flex;animation:fade .2s ease}
.md{background:var(--card);border-radius:24px;width:100%;max-width:420px;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.md .mi{width:52px;height:52px;border-radius:16px;background:var(--tint);color:var(--acc);display:grid;place-items:center;margin-bottom:14px}
.md .mi svg{width:26px;height:26px}
.md h3{font-size:24px;line-height:1.2;margin-bottom:8px}
.md p{color:var(--mute);font-size:15px;line-height:1.5;white-space:pre-line}
.md textarea{width:100%;height:110px;margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);font-size:15px;resize:vertical;outline:0}
.md textarea:focus{border-color:var(--acc)}
.prev{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto}
.prev div{display:flex;justify-content:space-between;gap:10px;background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14px}
.prev span{color:var(--mute);white-space:nowrap}
.mb{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.hide{display:none!important}
.streak{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--c-piano) 14%,transparent);color:var(--c-piano);font-size:13px;font-weight:500}
.streak svg{width:15px;height:15px}
.hint{font-size:12px;color:var(--mute);text-align:center;margin-top:12px}
.task.sw{transition:none}
.focus{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;align-items:center;justify-content:center;padding:24px}
.focus.show{display:flex;animation:fade .3s ease}
.fin{width:100%;max-width:420px;text-align:center}
.fin .big-ic{margin:18px auto 0;width:64px;height:64px;border-radius:var(--r4)}.fin .big-ic svg{width:30px;height:30px}
.fname{font-size:30px;margin-top:14px;line-height:1.2}
.fcd{font-size:72px;font-variant-numeric:tabular-nums;letter-spacing:-2px;margin-top:18px}
.fsub{color:var(--mute);font-size:14px;margin-top:4px}
.snd{display:flex;gap:6px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.fin .nowbtns{margin-top:22px}
.fin .sub{color:var(--mute);font-size:13px;margin-top:18px;line-height:1.45}
@media(max-width:400px){.wrap{padding:0 14px}h1{font-size:30px}.cd{font-size:38px}.composer{padding:12px 10px 10px 14px}.dock{padding-left:14px;padding-right:14px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,119,87,.5)}70%{box-shadow:0 0 0 8px rgba(217,119,87,0)}100%{box-shadow:0 0 0 0 rgba(217,119,87,0)}}
</style></head><body>
<div class="wrap">
<header><button class="gear" onclick="openSettings()" aria-label="Settings"><i data-i="gear"></i></button><div class="date" id="dt"></div><h1 class="serif" id="hi">Hello</h1><div class="sum" id="sum"></div><div id="stk"></div></header>
<div class="tabs"><button id="tbT" onclick="setTab('today')" data-t="Today">Today</button><button id="tbW" onclick="setTab('week')" data-t="Week">Week</button></div>

<div id="vToday">
<section class="now" id="nowc"></section>
<div class="composer">
<div class="inrow"><input id="nm" placeholder="Add something for today" data-tp="Add something for today" autocomplete="off" enterkeyhint="done"><button class="send" onclick="add()" aria-label="Add task"><i data-i="up"></i></button></div>
<div class="tools">
<label class="chip"><i data-i="clock"></i><input id="du" type="number" inputmode="numeric" placeholder="30"><span data-t="min">min</span></label>
<button class="chip" id="fxc" onclick="toggleFx()"><i data-i="timer"></i><span data-t="Flexible">Flexible</span></button>
<button class="chip" onclick="openPaste('today')"><i data-i="clip"></i><span data-t="Paste">Paste</span></button>
</div>
<div class="smart" id="smart"><i data-i="spark"></i><div class="t"><b data-t="Let Claude plan this">Let Claude plan this</b><br><span data-t="It splits your session into timed blocks.">It splits your session into timed blocks.</span></div><a class="btn acc" id="askA" href="https://claude.ai/new" target="_blank" rel="noopener" onclick="askClaude()" data-t="Ask Claude">Ask Claude</a></div>
</div>
<div class="label" id="lbl"></div>
<div id="list"></div>
<div class="skipped" id="skp"></div>
<p class="hint" id="hint" data-t="Swipe a task right to finish it, or left to skip it today.">Swipe a task right to finish it, or left to skip it today.</p>
</div>

<div id="vWeek" class="hide">
<div class="days" id="days"></div>
<div class="card" id="dayCard"></div>
<div class="card" id="pianoCard"></div>
<div class="card" id="studyCard"></div>
<div class="card"><div class="two"><label class="fld"><span data-t="Day ends">Day ends</span><input type="time" id="dayEnd"></label><label class="fld"><span data-t="Travel (min)">Travel (min)</span><input type="number" id="defTr" inputmode="numeric"></label></div></div>
</div>
</div>
<div class="dock" id="dock"><div class="in"><button class="btn flip" onclick="push()"><i data-i="fwd"></i><span data-t="Push">Push</span></button><input id="pm" type="number" inputmode="numeric" value="5"><span data-t="min">min</span><button class="btn" onclick="reloadDay()" style="margin-inline-start:auto"><i data-i="reset"></i><span data-t="Reload day">Reload day</span></button></div></div>
<div class="focus" id="focus"><div class="fin"><div class="nowtop" style="justify-content:center"><span class="pulse"></span><span data-t="Focus">Focus</span></div><div class="big-ic" id="fic"></div><div class="fname serif" id="fname"></div><div class="fcd serif" id="fcd">0:00</div><div class="fsub" id="fsub"></div><div class="track"><div id="ftb"></div></div>
<div class="snd"><button class="chip on" data-s="off" onclick="setSound('off')" data-t="Silent">Silent</button><button class="chip" data-s="rain" onclick="setSound('rain')" data-t="Rain">Rain</button><button class="chip" data-s="waves" onclick="setSound('waves')" data-t="Waves">Waves</button><button class="chip" data-s="brown" onclick="setSound('brown')" data-t="Deep hum">Deep hum</button></div>
<div class="nowbtns"><button class="btn acc grow" id="fdone" data-t="Done">Done</button><button class="btn" onclick="closeFocus()" data-t="Exit">Exit</button></div>
<p class="sub" data-t="Tip: turn on Do Not Disturb. Blocking apps will come with the Android app.">Tip: turn on Do Not Disturb. Blocking apps will come with the Android app.</p></div></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<script src="config.js"></script><script src="supabase.js"></script><script src="capacitor.js"></script><script src="local-notifications.js"></script>
<script>
var NOW_OVERRIDE=null;
const P={
music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
gym:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',

/* ---------- parsing Claude's answers ---------- */
function parse(tx){const out=[];String(tx||'').split(/\r?\n/).forEach(raw=>{const b=parseLine(raw);if(b)out.push(b)});return out}
function parseLine(raw){let l=raw.replace(/[*_`#>]/g,'').replace(/^\s*(\d+[.)]|[-•–])\s+/,'').trim();if(!l)return null;
 const ms=[...l.matchAll(/(\d+)\s*(minutes?|mins?|m)?(?!\w)/gi)];if(!ms.length)return null;
 const m=ms.filter(x=>x[2]).pop()||ms[ms.length-1];const d=+m[1];if(!d||d>300)return null;
 const name=(l.slice(0,m.index)+l.slice(m.index+m[0].length)).replace(/[()\[\]]/g,' ').replace(/^[\s\-–—:|,.]+|[\s\-–—:|,.]+$/g,'').replace(/\s{2,}/g,' ');
 if(!name||/^total/i.test(name))return null;return{name,dur:d}}
function parseWeek(tx){const plan={};let day=null;String(tx||'').split(/\r?\n/).forEach(raw=>{
 const l=raw.replace(/[*_`#>]/g,'').trim();const m=l.match(/^[-•\s]*(sun|mon|tue|wed|thu|fri|sat)[a-z]*\.?\s*[:\-–—]?\s*(.*)$/i);
 let rest=l;if(m){day=['sun','mon','tue','wed','thu','fri','sat'].indexOf(m[1].toLowerCase());rest=m[2]}
 if(day===null||!rest)return;rest.split(/[,;](?![^()]*\))/).forEach(part=>{const b=parseLine(part);if(b)(plan[day]=plan[day]||[]).push(b)})});return plan}

/* ---------- days ---------- */
function buildDay(d){const wd=d.getDay(),w=S.week[wd];const items=[];
 w.items.forEach(x=>{if(isPianoSlot(x)&&S.piano[wd]&&S.piano[wd].length){let tot=0;S.piano[wd].forEach(b=>{tot+=b.dur;items.push(it('Piano: '+b.name,b.dur,{ic:'music'}))});if(tot<60)items.push(it('Piano: free practice',60-tot,{ic:'music'}))}
  else items.push({...x,id:uid(),dur:isPianoSlot(x)?Math.max(60,x.dur):x.dur})});
 const k=dkey(d),sb=[];S.study.forEach(p=>(p.days[k]||[]).forEach(b=>sb.push(it('Study: '+b.name,b.dur,{ic:'book',study:p.id}))));
 if(sb.length){let at=items.findIndex(x=>x.opt||x.fill);if(at<0)at=items.length;items.splice(at,0,...sb)}
 S.today={start:w.start,items};S.anchor=null;S.day=k}
function ensureDay(){if(S.day!==dkey(new Date())){const t0=new Date();t0.setHours(0,0,0,0);S.study=S.study.filter(p=>fromKey(p.test)>=t0);buildDay(new Date());save()}}
function refreshToday(){const old=S.today.items,anchor=S.anchor;buildDay(new Date());S.anchor=anchor;
 S.today.items.forEach(x=>{const o=old.find(o=>o.name===x.name);if(o){x.done=o.done;x.skip=o.skip}});
 old.filter(o=>o.adhoc).forEach(o=>S.today.items.push(o));save()}
async function reloadDay(){if(await modal({icon:'reset',title:t('Reload {0}?',dayName(new Date().getDay())),text:t("This puts back today's routine from your Week tab and clears what you ticked off today."),yes:t('Reload')})){buildDay(new Date());save();render()}}

/* ---------- scheduling ---------- */
function plan(){const T=S.today,nowM=nowSec()/60,end=toMin(S.end);
 const live=T.items.filter(x=>!x.done&&!x.skip),flow=live.filter(x=>!x.fill),fills=live.filter(x=>x.fill);
 const base=Math.max(toMin(T.start),S.anchor??0);
 const fixed=flow.filter(x=>x.at).map(x=>{const s=toMin(x.at);let e=s+x.dur,over=false;if(x.flex&&nowM>=s&&nowM>=e){e=Math.floor(nowM)+1;over=true}return{id:x.id,s,e,over,tr:x.travel||0}});
 function run(b){const out=[];let c=base,lates=0;
  for(const x of flow){
   if(x.at){const f=fixed.find(f=>f.id===x.id);out.push({...x,s:f.s,e:f.e,e0:f.s+x.dur,over:f.over,fixed:true,late:f.e>end});c=Math.max(c,f.e);continue}
   let t=c,s,e,guard=0;
   while(guard++<50){s=t+(x.travel||0);e=s+x.dur;const hit=fixed.find(f=>t<f.e&&e>f.s-f.tr);if(!hit)break;t=Math.max(t,hit.e)}
   const e0=e;let over=false;if(x.flex&&nowM>=s&&nowM>=e){e=Math.floor(nowM)+1;over=true}
   const late=e>end;if(late)lates++;
   out.push({...x,s,e,e0,over,late});c=e+b}
  return{out,lates,b}}
 let best=null;for(const b of[10,5,0]){const r=run(b);if(!best||r.lates<best.lates)best=r}
 const out=best.out,noTime=[];
 if(fills.length){
  const busy=out.filter(o=>!o.late).map(o=>[o.s-(o.travel||0),o.e]).sort((a,b)=>a[0]-b[0]);
  const wins=[];let c=base;for(const[s0,e0]of busy){if(s0>c)wins.push([c,s0]);c=Math.max(c,e0)}if(end>c)wins.push([c,end]);
  wins.sort((a,b)=>(b[1]-b[0])-(a[1]-a[0]));
  fills.forEach((x,k)=>{const w=wins[k];if(!w){noTime.push(x);return}
   let ws=w[0],L=w[1]-w[0];if(best.b&&ws>base&&L-best.b>=60){ws+=best.b;L-=best.b}
   ws+=x.travel||0;L-=x.travel||0;if(L<30){noTime.push(x);return}
   let d=Math.ceil(L*0.7/30)*30;if(d>=L)d=Math.floor(L*0.7/30)*30;if(d<30)d=30;
   const s0=ws,e0=s0+d;let e=e0,over=false;if(nowM>=s0&&nowM>=e0&&x.flex){e=Math.floor(nowM)+1;over=true}
   out.push({...x,s:s0,e,e0,dur:d,over,late:false})})}
 out.sort((a,b)=>a.s-b.s);out.noTime=noTime;return out}

function parseStudy(tx,p){const out={};const t0=new Date();t0.setHours(0,0,0,0);const test=fromKey(p.test);
 String(tx||'').split(/\r?\n/).forEach(raw=>{const l=raw.replace(/[*_`#>]/g,'').trim();let d=null,rest='';

const syncPart=()=>{const o={};SYNC_KEYS.forEach(k=>{if(S[k]!==undefined)o[k]=S[k]});return o};
let lastHash=JSON.stringify(syncPart());
window.__onSave=()=>{if(applying)return;const h=JSON.stringify(syncPart());if(h===lastHash)return;lastHash=h;S.updatedAt=Date.now();
 try{localStorage.setItem('sm2',JSON.stringify(S))}catch(e){};schedulePush()};
function schedulePush(){if(!SB||!USER)return;clearTimeout(syncTimer);syncTimer=setTimeout(pushNow,1200)}
function setSync(st,msg){syncState=st;syncMsg=msg||'';if(st==='ok')syncAt=new Date();const el=g('syncst');if(el)el.textContent=syncText()}
function syncText(){return syncState==='saving'?t('Syncing…'):syncState==='error'?t('Sync problem: {0}',syncMsg):syncAt?t('Synced at {0}',fmt(syncAt.getHours()*60+syncAt.getMinutes())):t('Synced')}
async function pushNow(){if(!SB||!USER)return;setSync('saving');
 try{const{error}=await SB.from('schedules').upsert({user_id:USER.id,data:syncPart(),updated_at:new Date(S.updatedAt||Date.now()).toISOString()});setSync(error?'error':'ok',error&&error.message)}catch(e){setSync('error',t('no internet'))}}
async function pullNow(first){if(!SB||!USER)return;setSync('saving');let res;
 try{res=await SB.from('schedules').select('data,updated_at').eq('user_id',USER.id).maybeSingle()}catch(e){setSync('error',t('no internet'));return}
 if(res.error){setSync('error',res.error.message);return}
 const row=res.data;if(!row){S.synced=USER.id;S.updatedAt=S.updatedAt||Date.now();save();await pushNow();return}
 const rt=Date.parse(row.updated_at);
 if(first&&S.synced!==USER.id){S.synced=USER.id;save();
  if(S.updatedAt&&rt!==S.updatedAt){const ch=await modal({icon:'reset',title:t('Which schedule should we keep?'),text:t('Your account already has a schedule. Use the one from your account, or replace it with the one on this device?'),yes:t('Use my account'),extra:t('Use this device'),no:''});
   if(ch==='extra'){S.updatedAt=Date.now();save();await pushNow();return}}
  applyRemote(row.data,rt);return}
 if(rt>(S.updatedAt||0))applyRemote(row.data,rt);else if(rt<(S.updatedAt||0))await pushNow();else setSync('ok')}
function applyRemote(d,tm){applying=true;SYNC_KEYS.forEach(k=>{if(d&&d[k]!==undefined)S[k]=d[k]});S.updatedAt=tm;lastHash=JSON.stringify(syncPart());
 try{localStorage.setItem('sm2',JSON.stringify(S))}catch(e){};applying=false;applyLang();render();setSync('ok')}
function subscribe(){if(channel||!SB||!USER)return;
 channel=SB.channel('sched-'+USER.id).on('postgres_changes',{event:'*',schema:'public',table:'schedules',filter:'user_id=eq.'+USER.id},p=>{const r=p.new;if(!r||!r.updated_at)return;const tm=Date.parse(r.updated_at);if(tm>(S.updatedAt||0))applyRemote(r.data,tm)}).subscribe()}
function refreshSettings(){const b=g('setb');if(b)b.innerHTML=settingsHtml()}
async function initAuth(){if(!SB)return;try{const{data}=await SB.auth.getSession();USER=data.session?data.session.user:null}catch(e){}
 SB.auth.onAuthStateChange((ev,session)=>{const u=session?session.user:null;if((u&&u.id)===(USER&&USER.id))return;USER=u;
  if(USER){pullNow(true);subscribe()}else if(channel){SB.removeChannel(channel);channel=null}refreshSettings()});
 if(USER){pullNow(true);subscribe()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&USER)pullNow(false)});
function accountHtml(){const head=`<div class="stitle">${t('Account')}</div>`;
 if(!SB)return head+`<p class="sub" style="margin-top:6px">${t('Accounts are not set up yet.')}</p>`;
 if(!USER)return head+`<p class="sub" style="margin-top:6px">${t('Log in to sync your schedule between your phone and computer.')}</p><div class="btns" style="margin-top:10px"><button class="btn acc" onclick="authForm('login')">${t('Log in')}</button><button class="btn" onclick="authForm('signup')">${t('Sign up')}</button></div>`;
 return head+`<div class="ri"><div class="ic" style="${cv('users')}">${ic('users')}</div><div class="mid"><div class="name">${esc(USER.email)}</div><div class="meta" id="syncst">${esc(syncText())}</div></div><button class="btn" onclick="logout()">${t('Log out')}</button></div>`}
async function authForm(mode){const login=mode==='login';
 const ok=await modal({icon:'users',title:t(login?'Log in':'Create an account'),yes:t(login?'Log in':'Sign up'),
  html:`<div class="form"><label class="fld">${t('Email')}<input id="aE" type="email" autocomplete="email" inputmode="email"></label><label class="fld">${t('Password')}<input id="aP" type="password" autocomplete="${login?'current-password':'new-password'}" placeholder="${login?'':t('At least 6 characters')}"></label><p class="sub" id="aErr" style="color:var(--bad);margin:0"></p></div>`,
  onOpen:()=>{g('aE').focus();g('aP').onkeydown=e=>{if(e.key==='Enter')g('myes').click()}},
  validate:async()=>{const e=g('aE').value.trim(),p=g('aP').value;if(!e||!p){g('aErr').textContent=t('Fill in your email and password.');return false}
   try{const r=login?await SB.auth.signInWithPassword({email:e,password:p}):await SB.auth.signUp({email:e,password:p});
    if(r.error){g('aErr').textContent=r.error.message;return false}
    if(!login&&!r.data.session){g('aErr').textContent=t('Check your email to confirm your account, then log in.');return false}
    return true}catch(err){g('aErr').textContent=t('no internet');return false}}});
 if(ok)openSettings()}
async function logout(){if(await modal({icon:'users',title:t('Log out?'),text:t('Your schedule stays on this device, but it stops syncing.'),yes:t('Log out')})){await SB.auth.signOut();USER=null;openSettings()}}
if(!IS_NATIVE&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

function applyTheme(){const r=document.documentElement;if(S.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
 const dark=S.theme==='dark'||(S.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
 document.querySelectorAll('meta[name=theme-color]').forEach(m=>m.setAttribute('content',dark?'#161615':'#F4F3EE'))}
function applyLang(){const r=document.documentElement;r.lang=he()?'he':'en';r.dir=he()?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
 document.querySelectorAll('.gear').forEach(e=>e.setAttribute('aria-label',t('Settings')))}
function settingsHtml(){const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l,i])=>`<button class="${S[key]===v?'on':''}" onclick="setPref('${key}','${v}')">${i?ic(i):''}${l}</button>`).join('')}</div>`;
 return accountHtml()+`<div class="stitle">${t('Appearance')}</div>${seg('theme',[['system',t('System'),'phone'],['light',t('Light'),'sun'],['dark',t('Dark'),'moon']])}
 <div class="stitle">${t('Language')}</div>${seg('lang',[['en','English'],['he','עברית']])}`+nativeSettingsHtml()}
function openSettings(){modal({icon:'gear',title:t('Settings'),html:'<div id="setb">'+settingsHtml()+'</div>',yes:t('Done'),no:''})}
function setPref(k,v){S[k]=v;save();applyTheme();applyLang();render();
 const h3=document.querySelector('#md h3');if(h3)h3.textContent=t('Settings');const b=g('setb');if(b)b.innerHTML=settingsHtml();const y=g('myes');if(y)y.textContent=t('Done')}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
applyTheme();applyLang();initAuth();
if(needRefresh)refreshToday();

render();setInterval(tick,1000);setInterval(()=>render(),30000);
</script></body></html>
